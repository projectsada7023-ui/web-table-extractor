<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Table Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand"><img src="icons/icon48.png" alt="" aria-hidden="true"><h1>Web Table Extractor</h1></div>
    <p id="status">Detecting tables...</p>
    <label for="tableSelect">Table</label>
    <select id="tableSelect" disabled></select>
    <div id="preview" class="preview"></div>
    <div class="export-actions"><button id="exportCsv" disabled>Export CSV</button><button id="exportExcel" class="secondary" disabled>Export Excel</button></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
